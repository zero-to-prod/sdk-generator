# Exercises the YAML the wild actually ships: a comment header in front of an
# explicit document-start marker, unquoted scalars, block scalars, anchors and
# merge keys, a flow mapping, and a complex mapping key.

---
openapi: 3.0.3
info:
  title: Yaml
  version: '1.0.0'
  description: |
    A document written in YAML rather than JSON,
    with a description spanning two lines.
paths:
  /v1/things:
    get:
      operationId: things/list
      summary: >-
        List every thing.
      parameters:
        - {name: page, in: query, schema: {type: integer}}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  things:
                    type: array
                    items:
                      $ref: '#/components/schemas/thing'
  # A dumper writes any key past its length limit in the explicit `? key` form.
  ? "/v1/things/{thing_id}/parts/{part_id}/revisions/{revision_id}/attachments/{attachment_id}/downloads"
  : get:
      operationId: things/download
      responses:
        '200':
          description: ok
components:
  schemas:
    named: &named
      type: object
      properties:
        name:
          type: string
    thing:
      <<: *named
      description: A thing.
